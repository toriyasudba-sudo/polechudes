<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поле Чудес: 90s Edition (Mini App)</title>
    <style>
        :root {
            --bg-color: #0c0f1d;
            --panel-bg: #151c36;
            --accent: #ffcc00;
            --text-color: #ffffff;
            --border-color: #3b4c7a;
            --danger: #ff3333;
            --success: #33cc66;
        }
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .app-container {
            width: 100%;
            max-width: 420px;
            background: var(--panel-bg);
            border: 3px solid var(--accent);
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            box-sizing: border-box;
        }
        h1 {
            font-size: 18px;
            text-align: center;
            color: var(--accent);
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px #000;
        }
        /* Блок персонажей */
        .characters-stage {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #090c18;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 10px;
        }
        .character-card {
            text-align: center;
            width: 30%;
        }
        .avatar-box {
            width: 52px;
            height: 52px;
            background: #232d52;
            border: 2px solid var(--accent);
            border-radius: 6px;
            margin: 0 auto 4px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }
        .character-name {
            font-size: 10px;
            color: #a0aec0;
            text-transform: uppercase;
            font-weight: bold;
        }
        /* Диалог ведущего */
        .host-dialog {
            background: #1a2240;
            border: 1px dashed var(--accent);
            padding: 8px;
            border-radius: 6px;
            font-size: 12px;
            text-align: center;
            margin-bottom: 10px;
            color: #63b3ed;
            min-height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        /* Табло счета */
        .scoreboard {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            background: #090c18;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
            font-weight: bold;
        }
        /* Игровое табло со словом */
        .word-board {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .letter-box {
            width: 32px;
            height: 40px;
            background: #2b6cb0;
            color: white;
            font-size: 22px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            border: 2px solid #63b3ed;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.4);
        }
        /* Барабан */
        .wheel-section {
            text-align: center;
            margin-bottom: 15px;
        }
        .wheel-container {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 0 auto 10px auto;
        }
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 5px solid var(--accent);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            background: conic-gradient(
                #e53e3e 0deg 51.4deg,
                #3182ce 51.4deg 102.8deg,
                #38a169 102.8deg 154.2deg,
                #d69e2e 154.2deg 205.6deg,
                #805ad5 205.6deg 257deg,
                #d53f8c 257deg 308.4deg,
                #319795 308.4deg 360deg
            );
            transition: transform 3s cubic-bezier(0.15, 0.85, 0.15, 1);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 16px solid #fff;
            z-index: 10;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.8));
        }
        .wheel-center {
            width: 46px;
            height: 46px;
            background: #0c0f1d;
            border-radius: 50%;
            border: 2px solid var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            color: #fff;
            text-align: center;
            line-height: 1.1;
        }
        button.spin-btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 10px;
            font-weight: bold;
            font-size: 15px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        button.spin-btn:active {
            transform: scale(0.98);
        }
        button.spin-btn:disabled {
            background: #4a5568;
            color: #a0aec0;
            cursor: not-allowed;
        }
        /* Клавиатура */
        .keyboard {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }
        .key-btn {
            background: #2d3748;
            color: white;
            border: 1px solid #4a5568;
            padding: 8px 0;
            font-size: 13px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
        }
        .key-btn:active {
            background: #1a202c;
        }
        .key-btn.used {
            background: #1a202c;
            color: #4a5568;
            border-color: #1a202c;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div class="app-container">
    <h1>Поле Чудес 90s</h1>

    <!-- Персонажи -->
    <div class="characters-stage">
        <div class="character-card">
            <div class="avatar-box">🧢</div>
            <div class="character-name">Вы</div>
        </div>
        <div class="character-card">
            <div class="avatar-box">🐷</div>
            <div class="character-name">Пятачок</div>
        </div>
        <div class="character-card">
            <div class="avatar-box">🧔</div>
            <div class="character-name">Ведущий</div>
        </div>
    </div>

    <!-- Диалог ведущего -->
    <div class="host-dialog" id="hostDialog">
        «Приветствуем вас в студии! Крутите барабан!»
    </div>

    <!-- Счет и подсказка -->
    <div class="scoreboard">
        <div>Очки: <span id="score">0</span></div>
        <div>Тема: <span id="hint">Создатель игры (1993)</span></div>
    </div>

    <!-- Буквы слова -->
    <div class="word-board" id="wordBoard"></div>

    <!-- Барабан -->
    <div class="wheel-section">
        <div class="wheel-container">
            <div class="pointer"></div>
            <div class="wheel" id="wheel">
                <div class="wheel-center" id="wheelText">СТАРТ</div>
            </div>
        </div>
        <button class="spin-btn" id="spinBtn" onclick="spinWheel()">Крутить барабан!</button>
    </div>

    <!-- Клавиатура -->
    <div class="keyboard" id="keyboard"></div>
</div>

<script>
    const secretWord = "БАШУРОВ";
    let score = 0;
    let currentSectorValue = 0;
    let canGuess = false;
    let guessedLetters = new Set();
    let currentRotation = 0;

    const sectors = [
        {name: "100", val: 100},
        {name: "500", val: 500},
        {name: "ПРИЗ", val: "PRIZE"},
        {name: "БАНКРОТ", val: 0},
        {name: "1000", val: 1000},
        {name: "250", val: 250},
        {name: "Х2", val: "X2"}
    ];

    function initBoard() {
        const board = document.getElementById('wordBoard');
        board.innerHTML = '';
        for (let char of secretWord) {
            const box = document.createElement('div');
            box.className = 'letter-box';
            box.innerText = guessedLetters.has(char) ? char : '';
            board.appendChild(box);
        }
    }

    function initKeyboard() {
        const kb = document.getElementById('keyboard');
        kb.innerHTML = '';
        const alphabet = "АБВГДЕЖЗИКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ";
        for (let char of alphabet) {
            const btn = document.createElement('div');
            btn.className = 'key-btn';
            btn.innerText = char;
            btn.id = 'key-' + char;
            btn.onclick = () => guessLetter(char);
            kb.appendChild(btn);
        }
    }

    function spinWheel() {
        if (canGuess) {
            setHostDialog("Ведущий: «Вы уже покрутили! Называйте букву на клавиатуре».");
            return;
        }
        
        document.getElementById('spinBtn').disabled = true;
        const randomSectorIndex = Math.floor(Math.random() * sectors.length);
        const sector = sectors[randomSectorIndex];
        
        // 4 полных оборота + сектор
        currentRotation += 360 * 4 + (randomSectorIndex * (360 / sectors.length));
        document.getElementById('wheel').style.transform = `rotate(${currentRotation}deg)`;

        setTimeout(() => {
            currentSectorValue = sector.val;
            document.getElementById('wheelText').innerText = sector.name;
            
            if (currentSectorValue === 0) {
                score = 0;
                updateScore();
                setHostDialog("Ведущий: «Эх, батенька, банкрот! Ваши очки сгорели!»");
                document.getElementById('spinBtn').disabled = false;
            } else if (currentSectorValue === "PRIZE") {
                setHostDialog("Ведущий: «Сектор ПРИЗ! Назовите букву или берите деньги!»");
                canGuess = true;
            } else {
                setHostDialog(`Ведущий: «Выпало ${sector.name} очков! Называйте букву».`);
                canGuess = true;
            }
        }, 3100);
    }

    function guessLetter(char) {
        if (!canGuess) {
            setHostDialog("Ведущий: «Сначала покрутите барабан, голубчик!»");
            return;
        }

        document.getElementById('key-' + char).classList.add('used');
        guessedLetters.add(char);

        if (secretWord.includes(char)) {
            let count = [...secretWord].filter(x => x === char).length;
            if (typeof currentSectorValue === 'number') {
                score += currentSectorValue * count;
            } else if (currentSectorValue === "PRIZE") {
                score += 500; // бонус за приз
            }
            updateScore();
            initBoard();

            if ([...secretWord].every(l => guessedLetters.has(l))) {
                setHostDialog("Ведущий: «Победитель! В студию черный ящик и аплодисменты!»");
                document.getElementById('spinBtn').disabled = true;
                canGuess = false;
                return;
            }
            setHostDialog(`Ведущий: «Есть такая буква! Открываем! Крутите дальше».`);
        } else {
            setHostDialog(`Ведущий: «Нет такой буквы в этом слове! Ход переходит дальше».`);
        }

        canGuess = false;
        document.getElementById('spinBtn').disabled = false;
    }

    function updateScore() {
        document.getElementById('score').innerText = score;
    }

    function setHostDialog(text) {
        document.getElementById('hostDialog').innerText = text;
    }

    initBoard();
    initKeyboard();
</script>

</body>
</html>
